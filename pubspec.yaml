name: booky
description: Booky is an application to help publish second-hand book

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0-305.0.dev <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.17.1
  ffi: ^2.0.1
  flutter_rust_bridge: ^2.0.0-dev.39
  json_annotation: ^4.8.0
  jwt_decoder: ^2.0.1
  meta: ^1.8.0
  path: ^1.8.3
  super_clipboard: ^0.8.17
  super_drag_and_drop: ^0.8.17
  super_native_extensions: ^0.8.17
  kt_dart: ^1.1.0
  camera: ^0.11.0+1
  camera_android: ^0.10.9+3
  permission_handler: ^11.3.1
  google_mlkit_commons: ^0.7.1
  google_mlkit_barcode_scanning: ^0.12.0
  flutter_image_compress: ^2.3.0
  image: ^4.0.17
  vector_math: ^2.1.4
  stream_transform: ^2.1.0
  audioplayers: ^6.0.0
  flutter_scroll_shadow: ^1.2.4
  intersperse: ^2.0.0
  recase: ^4.1.0
  uuid: ^4.4.0
  path_provider: ^2.1.0
  scroll_to_index: ^3.0.1
  #  rust_builder:
  #    path: rust_builder
  equatable: ^2.0.5
  rust_lib_booky:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.1
  json_serializable: ^6.6.1
  ffigen: ^12.0.0
  device_info_plus: ^10.1.0
  flutter_linter:
    git:
      url: https://github.com/pixelshot91/flutter_linter.git

flutter:
  uses-material-design: true


  assets:
    - assets/sounds/

